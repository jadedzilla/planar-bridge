<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#1b1d21">
  <meta name="application-name" content="Planar Bridge">
  <meta name="apple-mobile-web-app-title" content="Planar Bridge">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Planar Bridge</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Landing: create or join a session -->
  <section id="landing" class="landing" hidden>
    <div class="landing-card">
      <h1>Planar Bridge</h1>
      <p class="muted">A shared table for up to 4 players. The app tracks life totals; you run the rest of the game yourselves.</p>
      <label class="field">Your name
        <input id="nameInput" maxlength="24" autocomplete="nickname" placeholder="e.g. Emma">
      </label>
      <div class="landing-box decks-box">
        <div class="decks-head">
          <h2>Your decks</h2>
          <p class="note">Saved on this device. Tap the deck you want to bring.</p>
        </div>
        <div id="deckList" class="deck-shelf" role="radiogroup" aria-label="Deck to bring"></div>
      </div>
      <div class="landing-split">
        <div class="landing-box">
          <h2>New session</h2>
          <label class="field">Starting life
            <select id="lifeSelect">
              <option value="20">20 (standard)</option>
              <option value="30">30 (Brawl)</option>
              <option value="40">40 (Commander)</option>
            </select>
          </label>
          <button id="createBtn" class="btn primary">Create session</button>
        </div>
        <div class="landing-box">
          <h2>Join a session</h2>
          <label class="field">Session code
            <input id="codeInput" maxlength="5" autocapitalize="characters" autocomplete="off" placeholder="ABCDE">
          </label>
          <button id="joinBtn" class="btn">Join</button>
        </div>
      </div>
      <p id="landingError" class="error" role="alert"></p>
    </div>
  </section>

  <!-- Table: your playmat fills the screen; other players are bands on the edges -->
  <section id="game" class="game" hidden>
    <main id="table" class="table">
      <div id="myArea" class="my-area"></div>
      <div class="edge" data-rel="1"></div>
      <div class="edge" data-rel="2"></div>
      <div class="edge" data-rel="3"></div>
      <div id="focusArea" class="focus-area" hidden></div>
    </main>
    <div class="hud hud-tl">
      <button class="code-chip" id="inviteBtn" title="Share invite link"><b id="codeLabel"></b></button>
    </div>
    <div class="hud hud-tr">
      <button class="btn round" data-act="draw" title="Draw a card">Draw</button>
      <button class="btn round icon" data-act="more" title="Menu" aria-label="Menu">☰</button>
    </div>
    <div class="hud hud-bl life me-life">
      <button data-mylife="-1" aria-label="Lose 1 life">−</button>
      <span class="spindown" id="myDie"><span class="val" id="myLife"></span></span>
      <button data-mylife="1" aria-label="Gain 1 life">+</button>
    </div>
    <footer id="handBar" class="handbar" data-drop="1" data-zone="hand">
      <button class="hand-tab" id="handTab">Hand <span id="handCount"></span> <span class="caret">▾</span></button>
      <div id="hand" class="hand"></div>
    </footer>
    <div id="banner" class="banner" hidden></div>
    <aside id="logPanel" class="logpanel" hidden>
      <div class="logpanel-head"><b>Game log</b><button class="btn small" data-act="log">Close</button></div>
      <ol id="logList"></ol>
    </aside>
  </section>

  <!-- Bottom sheet used for menus, deck import and pile viewers -->
  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="preview" class="preview" hidden><img alt=""></div>
  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
